<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1d4ed8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="实验报告工具" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>建筑结构检测技术实验报告工具</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["\\(", "\\)"]],
        displayMath: [["\\[", "\\]"]]
      },
      svg: { fontCache: "global" },
      options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    :root {
      --ink: #1f2933;
      --muted: #64748b;
      --line: #cbd5e1;
      --paper: #ffffff;
      --bg: #eef2f7;
      --accent: #1d4ed8;
      --accent-soft: #dbeafe;
      --ok: #047857;
      --warn: #b45309;
      --bad: #b91c1c;
      --panel: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.65;
      letter-spacing: 0;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(248, 250, 252, 0.96);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .header-inner {
      max-width: 1220px;
      margin: 0 auto;
      padding: 12px 18px;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 14px;
      align-items: center;
    }

    .brand {
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.2;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .mobile-picker {
      display: none;
      gap: 6px;
      align-items: center;
    }

    .mobile-picker span {
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }

    .global-actions,
    .report-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: flex-end;
    }

    button,
    .file-label {
      border: 1px solid #94a3b8;
      background: #ffffff;
      color: #0f172a;
      padding: 6px 10px;
      min-height: 34px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    button.ghost {
      border-color: transparent;
      background: transparent;
    }

    button:hover,
    .file-label:hover {
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
    }

    .layout {
      max-width: 1220px;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 18px;
    }

    #reports {
      min-width: 0;
    }

    .sidebar {
      position: sticky;
      top: 82px;
      align-self: start;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      max-height: calc(100vh - 100px);
      overflow: auto;
    }

    .nav-btn {
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 9px 10px;
      border-radius: 6px;
      color: #334155;
      white-space: normal;
      line-height: 1.35;
    }

    .nav-btn.active {
      background: var(--accent-soft);
      color: #1e40af;
      font-weight: 700;
    }

    .report-page {
      display: none;
      width: min(100%, 210mm);
      min-height: 297mm;
      margin: 0 auto 22px;
      padding: 18mm 16mm;
      background: var(--paper);
      border: 1px solid #d7dee8;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.09);
    }

    .report-page.active { display: block; }

    .report-title {
      text-align: center;
      margin: 0 0 18px;
      font-size: 22px;
      line-height: 1.4;
      font-weight: 700;
    }

    .experiment-title {
      text-align: center;
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: 700;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px 14px;
      margin: 12px 0 18px;
      align-items: end;
    }

    .meta-grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    label.field {
      display: grid;
      grid-template-columns: auto minmax(80px, 1fr);
      gap: 6px;
      align-items: center;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 0;
      border-bottom: 1px solid #94a3b8;
      padding: 4px 5px;
      min-height: 30px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }

    input[type="number"] { text-align: center; }

    textarea {
      min-height: 92px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fcfdff;
    }

    select {
      border: 1px solid var(--line);
      border-radius: 6px;
    }

    .section {
      margin: 18px 0;
      break-inside: avoid;
    }

    .section h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .prefilled {
      margin: 0;
      padding: 10px 12px;
      border-left: 3px solid var(--accent);
      background: #f8fafc;
      white-space: pre-wrap;
    }

    .note {
      color: var(--muted);
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      table-layout: fixed;
    }

    th,
    td {
      border: 1px solid var(--line);
      padding: 6px;
      min-height: 34px;
      text-align: center;
      vertical-align: middle;
      font-size: 13px;
      word-break: break-word;
    }

    th {
      background: #f1f5f9;
      font-weight: 700;
    }

    td input,
    th input {
      border: 0;
      padding: 2px;
      min-height: 24px;
      background: transparent;
      text-align: center;
    }

    .wide-scroll {
      overflow-x: auto;
      margin: 10px 0;
      -webkit-overflow-scrolling: touch;
    }

    .wide-scroll table {
      min-width: 820px;
      margin: 0;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin: 10px 0;
    }

    .result-box {
      border: 1px solid #bfdbfe;
      background: #eff6ff;
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 10px;
      white-space: pre-wrap;
      overflow-x: hidden;
    }

    .formula-output {
      display: grid;
      gap: 10px;
      white-space: normal;
      min-width: 0;
    }

    .formula-card {
      border: 1px solid #dbeafe;
      background: #ffffff;
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
      overflow: hidden;
    }

    .formula-name {
      margin-bottom: 8px;
      color: #1e3a8a;
      font-weight: 700;
      font-size: 13px;
    }

    .formula-math {
      display: block;
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 0 8px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      scrollbar-width: thin;
    }

    .formula-math mjx-container {
      margin: 0 !important;
      text-align: left !important;
      font-size: 105% !important;
      min-width: max-content;
      max-width: none !important;
    }

    .formula-math svg {
      max-width: none !important;
    }

    .formula-plain {
      margin-top: 8px;
      color: #475569;
      font-size: 12px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .formula-note {
      color: #334155;
      white-space: pre-wrap;
      line-height: 1.65;
    }

    .canvas-wrap {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 8px;
      margin: 10px 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 280px;
    }

    .upload-preview {
      min-height: 130px;
      border: 1px dashed #94a3b8;
      background: #f8fafc;
      border-radius: 8px;
      display: grid;
      place-items: center;
      padding: 10px;
      color: var(--muted);
      text-align: center;
    }

    .upload-preview img {
      max-width: 100%;
      max-height: 260px;
      display: block;
    }

    .small-input { max-width: 110px; }
    .status { color: var(--ok); font-size: 13px; min-height: 20px; }
    .danger { color: var(--bad); }
    .warn { color: var(--warn); }
    .ok { color: var(--ok); }

    @media (max-width: 920px) {
      .header-inner,
      .layout {
        grid-template-columns: 1fr;
      }

      .global-actions,
      .report-actions {
        justify-content: flex-start;
      }

      .sidebar {
        position: static;
        max-height: none;
      }

      .report-page {
        padding: 12mm 7mm;
      }

      .meta-grid,
      .meta-grid.two {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      body {
        background: #fff;
        line-height: 1.55;
        overflow-x: hidden;
      }

      .app-header {
        position: static;
        background: #fff;
      }

      .header-inner {
        padding: 10px 12px 12px;
        gap: 10px;
      }

      .brand h1 {
        font-size: 17px;
      }

      .brand p {
        font-size: 12px;
      }

      .mobile-picker {
        display: grid;
        width: calc(100vw - 48px);
        max-width: calc(100vw - 48px);
        margin: 0 auto;
      }

      .mobile-picker select {
        min-height: 38px;
        border-radius: 8px;
        background: #f8fafc;
        font-size: 15px;
      }

      .global-actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        min-width: 0;
        width: calc(100vw - 48px);
        max-width: calc(100vw - 48px);
        margin: 0 auto;
      }

      .global-actions button,
      .report-actions button,
      .report-actions .file-label {
        width: 100%;
        min-width: 0;
        min-height: 40px;
        padding: 7px 8px;
        font-size: 13px;
        white-space: normal;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .layout {
        display: block;
        padding: 0;
      }

      .sidebar {
        display: none;
      }

      .report-page {
        width: 100%;
        max-width: 100vw;
        min-height: 0;
        margin: 0;
        padding: 14px 12px 24px;
        border: 0;
        box-shadow: none;
        overflow-x: hidden;
      }

      .experiment-title {
        margin-bottom: 14px;
        margin-left: auto;
        margin-right: auto;
        max-width: 280px;
        font-size: 15px;
        line-height: 1.45;
        overflow-wrap: anywhere;
        word-break: break-all;
      }

      .meta-grid,
      .meta-grid.two {
        gap: 8px;
        margin: 10px 0 14px;
      }

      label.field {
        grid-template-columns: 1fr;
        gap: 2px;
        font-size: 14px;
      }

      input,
      textarea,
      select {
        min-height: 38px;
        font-size: 16px;
        min-width: 0;
      }

      textarea {
        min-height: 120px;
      }

      .report-actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        margin: 10px 0 14px;
        min-width: 0;
        width: calc(100vw - 48px);
        max-width: calc(100vw - 48px);
        margin-left: auto;
        margin-right: auto;
      }

      .report-actions .status {
        grid-column: 1 / -1;
      }

      .section {
        margin: 16px 0;
      }

      .section h3 {
        font-size: 15px;
        line-height: 1.45;
      }

      .prefilled,
      .result-box {
        padding: 10px;
        border-radius: 8px;
        font-size: 14px;
      }

      .formula-chain {
        display: block;
        font-size: 12px;
      }

      .formula-eq {
        display: block;
        margin: 4px 0;
      }

      .formula-card {
        padding: 10px;
      }

      .formula-math mjx-container {
        font-size: 95% !important;
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .toolbar label {
        display: grid;
        gap: 5px;
      }

      .small-input {
        max-width: none;
      }

      table {
        table-layout: auto;
      }

      th,
      td {
        min-width: 74px;
        padding: 6px 5px;
        font-size: 12px;
      }

      td input,
      th input {
        min-height: 30px;
        font-size: 14px;
      }

      .wide-scroll {
        margin-left: -12px;
        margin-right: -12px;
        padding: 0 12px 8px;
      }

      .wide-scroll table {
        min-width: 760px;
      }

      .canvas-wrap {
        margin-left: -4px;
        margin-right: -4px;
        padding: 6px;
      }

      canvas {
        height: 220px;
      }

      .upload-preview {
        min-height: 110px;
      }
    }

    @media print {
      body { background: #fff; }
      .app-header,
      .sidebar,
      .mobile-picker,
      .report-actions,
      .toolbar,
      .file-label,
      .note.no-print { display: none !important; }
      .layout {
        display: block;
        max-width: none;
        padding: 0;
      }
      .report-page,
      .report-page.active {
        display: block;
        width: 210mm;
        min-height: 297mm;
        box-shadow: none;
        border: 0;
        page-break-after: always;
      }
      input,
      textarea,
      select {
        border-color: #888;
      }
      .prefilled,
      .result-box {
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <h1>建筑结构检测技术实验报告</h1>
        <p>预习内容已按指导书填写，实验后输入数据即可计算、画图、打印。</p>
      </div>
      <label class="mobile-picker">
        <span>当前实验</span>
        <select id="mobileExperimentSelect" aria-label="选择实验"></select>
      </label>
      <div class="global-actions">
        <button class="primary" id="saveAllBtn">保存全部</button>
        <button id="loadDemoBtn">填入示例数据</button>
        <button id="clearCurrentBtn">清空当前实验数据</button>
        <button id="printBtn">打印/另存为 PDF</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar" id="nav"></aside>
    <section id="reports"></section>
  </main>

  <template id="commonMetaTemplate">
    <div class="meta-grid">
      <label class="field">学号 <input data-key="studentId"></label>
      <label class="field">姓名 <input data-key="studentName"></label>
      <label class="field">专业、班 <input data-key="className"></label>
      <label class="field">实验地点 <input data-key="place"></label>
      <label class="field">指导老师 <input data-key="teacher"></label>
      <label class="field">试验日期 <input data-key="date" placeholder="年 月 日"></label>
    </div>
  </template>

  <script>
    const APP_KEY = "building-structure-lab-report-v1";

    const experiments = [
      { id: "rebound", title: "回弹法检测混凝土抗压强度" },
      { id: "ultrasonic", title: "超声法检测混凝土缺陷" },
      { id: "gps", title: "工程测量的 GPS 技术" },
      { id: "radar", title: "混凝土内部缺陷无损检测" },
      { id: "crack", title: "裂缝深度及宽度检测实验" },
      { id: "lining", title: "衬砌背部空洞检测实验" },
      { id: "carbonation", title: "碳化深度测定实验" },
      { id: "cover", title: "钢筋保护层厚度检测实验" },
      { id: "pile", title: "基桩完整性检测实验" },
      { id: "bridge", title: "桥梁动静载实验" }
    ];

    const prefill = {
      ultrasonic: {
        principle: "超声脉冲波在混凝土中传播时，遇到空洞、不密实区或裂缝会发生绕射、反射、散射和衰减，使声时、声速、波幅、主频和波形产生变化。检测时在相同条件下比较各测点声学参数，若某一区域声速降低、声时增大、波幅或频率明显降低，可判断该区域可能存在缺陷。",
        paper: "超声法检测混凝土缺陷是一种无损检测方法。其基本思想是利用超声波在混凝土中的传播特性判断内部质量。当混凝土均匀密实时，声速、波幅和主频等参数变化较小；当内部存在空洞、不密实或裂缝时，声波传播路径变长，能量衰减加大，接收信号波幅降低，主频下降，波形也可能发生畸变。因此，通过布置换能器并测量声时、波幅和频率，可分析缺陷的位置、范围和性质。检测前应清理测试面并保证耦合良好，测点布置应避开与声波传播方向一致的主钢筋。"
      },
      gps: {
        purpose: "了解 GPS 系统组成、差分定位原理和工程测量中的基本操作流程；掌握基准站、流动站的架设与测量/放样方法。",
        equipment: "GPS 接收机、手簿、对中杆、三脚架、测高尺、蓝牙或 USB 连接设备；应选择开阔区域，减少遮挡和多路径影响。",
        principle: "GPS 由空间卫星、地面监控系统和用户接收机组成。接收机通过测量卫星信号到达时间，计算用户到卫星的距离，并结合卫星位置解算测站坐标。为提高精度，工程测量常采用差分 GPS：基准站在已知点观测并计算改正数，流动站接收改正数后修正定位结果。载波相位差分 RTK 可达到厘米级定位精度。",
        steps: "1. 在已知控制点架设基准站，对中、整平并量取仪器高。\n2. 打开 GPS 和手簿，完成蓝牙或 USB 连接，输入控制点坐标、仪器高和坐标系参数。\n3. 架设流动站，输入对中杆高度并选择测量或放样功能。\n4. 测量时将流动站置于待测点采集坐标；放样时输入设计坐标，根据手簿提示移动至目标位置。\n5. 保存测量数据，检查固定解状态和观测质量。"
      },
      radar: {
        purpose: "熟悉手持雷达的特点和测试方法，了解利用雷达法检测混凝土内部钢筋、空洞和缺陷位置的基本过程。",
        equipment: "MJ-105 手持式雷达或同类无损检测设备。测试表面应平整、清洁，仪器参数应根据构件厚度和探测目标设置。",
        principle: "雷达法依据材料电磁特性差异进行检测。仪器从混凝土表面向内部发射电磁波，当电磁波遇到钢筋、空洞或不同介质界面时会产生反射，接收天线采集反射信号并形成图像，由反射波形和位置判断内部目标或缺陷。",
        steps: "1. 确定被测区域和仪器行走方向。\n2. 设置测量参数，包括量程、介质波速、采样参数等。\n3. 使仪器沿测试方向缓慢、匀速移动。\n4. 仪器自动存储扫描数据。\n5. 对波形图像进行处理，识别钢筋、空洞或异常反射位置。"
      },
      lining: {
        purpose: "了解地质雷达的工作原理和特点，掌握衬砌背部空洞检测方法，判断衬砌背后是否存在空洞及其位置和规模。",
        equipment: "地质雷达主机、天线、采集软件和运行设备。系统增益不低于 150dB，信噪比不低于 60dB，采样间隔一般不大于 0.5ns；天线最大探测深度应大于 2m，垂直分辨率宜高于 2cm。",

    const state = loadState();
    let activeId = state.activeId || experiments[0].id;

    function loadState() {
      try {
        return JSON.parse(localStorage.getItem(APP_KEY)) || {};
      } catch {
        return {};
      }
    }

    function saveState() {
      collectInputs();
      state.activeId = activeId;
      localStorage.setItem(APP_KEY, JSON.stringify(state));
      setStatus(activeId, "已保存到浏览器本地。");
    }

    function collectInputs(root = document) {
      root.querySelectorAll("[data-key]").forEach(el => {
        const page = el.closest(".report-page");
        if (!page) return;
        const id = page.dataset.id;
        state[id] ||= {};
        if (el.type === "file") return;
        state[id][el.dataset.key] = el.value;
      });
    }

    function hydrateInputs(root = document) {
      root.querySelectorAll("[data-key]").forEach(el => {
        const page = el.closest(".report-page");
        if (!page) return;
        const id = page.dataset.id;
        const value = state[id]?.[el.dataset.key];
        if (value !== undefined) el.value = value;
      });
    }

    function setStatus(id, text) {
      const el = document.querySelector(`[data-status-for="${id}"]`);
      if (el) {
        el.textContent = text;
        setTimeout(() => {
          if (el.textContent === text) el.textContent = "";
        }, 2600);
      }
    }

    function input(key, type = "text", attrs = "") {
      return `<input ${type ? `type="${type}"` : ""} data-key="${key}" ${attrs}>`;
    }

    function textarea(key, placeholder = "", rows = 4) {
      return `<textarea data-key="${key}" rows="${rows}" placeholder="${placeholder}"></textarea>`;
    }

    function commonMeta() {
      return `
        <div class="meta-grid">
          <label class="field">学号 ${input("studentId")}</label>
          <label class="field">姓名 ${input("studentName")}</label>
          <label class="field">专业、班 ${input("className")}</label>
          <label class="field">实验地点 ${input("place")}</label>
          <label class="field">指导老师 ${input("teacher")}</label>
          <label class="field">试验日期 ${input("date", "text", 'placeholder="年 月 日"')}</label>
        </div>`;
    }

    function actions(id) {
      return `
        <div class="report-actions no-print">
          <button class="primary" data-action="calc" data-id="${id}">计算/刷新图表</button>
          <button data-action="save" data-id="${id}">保存本实验数据</button>
          <button data-action="csv" data-id="${id}">导出本实验结果 CSV</button>
          <button data-action="png" data-id="${id}">导出图表 PNG</button>
          <label class="file-label">导入本实验 CSV <input class="csv-import-input" type="file" accept=".csv,text/csv" data-import-csv="${id}" hidden></label>
          <span class="status" data-status-for="${id}"></span>
        </div>`;
    }

    function prefilled(text) {
      return `<p class="prefilled">${escapeHtml(text)}</p>`;
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function formulaLine(name, originalTex, substitutionTex, resultTex, plainText = "") {
      return `
        <div class="formula-card">
          <div class="formula-name">${escapeHtml(name)}</div>
          <div class="formula-math">\\[${originalTex} = ${substitutionTex} = ${resultTex}\\]</div>
          ${plainText ? `<div class="formula-plain">${escapeHtml(plainText)}</div>` : ""}
        </div>`;
    }

    function formulaStatement(name, text, tex) {
      return `
        <div class="formula-card">
          <div class="formula-name">${escapeHtml(name)}</div>
          <div class="formula-plain">${escapeHtml(text)}</div>
          <div class="formula-math">\\[${tex}\\]</div>
        </div>`;
    }

    function ratioTexPairs(pairs) {
      return pairs.length ? pairs.map(pair => `\\frac{${fmt(pair.rm, 1)}}{${fmt(pair.strength, 1)}}`).join(" + ") : "\\cdots";
    }

    function noteBlock(text) {
      return `<div class="formula-note">${escapeHtml(text)}</div>`;
    }

    function setResultHtml(id, html) {
      const el = document.getElementById(id);
      if (!el) return;
      el.innerHTML = html;
      if (window.MathJax?.typesetPromise) {
        window.MathJax.typesetPromise([el]).catch(() => {});
      }
    }

    function buildNav() {
      const nav = document.getElementById("nav");
      nav.innerHTML = experiments.map((exp, index) =>
        `<button class="nav-btn ${exp.id === activeId ? "active" : ""}" data-nav="${exp.id}">${index + 1}. ${exp.title}</button>`
      ).join("");
      const mobileSelect = document.getElementById("mobileExperimentSelect");
      mobileSelect.innerHTML = experiments.map((exp, index) =>
        `<option value="${exp.id}">${index + 1}. ${exp.title}</option>`
      ).join("");
      mobileSelect.value = activeId;
    }

    function buildReports() {
      const reports = document.getElementById("reports");
      reports.innerHTML = [
        renderRebound(),
        renderUltrasonic(),
        renderGps(),
        renderRadar(),
        renderCrack(),
        renderLining(),
        renderCarbonation(),
        renderCover(),
        renderPile(),
        renderBridge()
      ].join("");
      hydrateInputs();
      showExperiment(activeId);
      wireUploads();
    }

    function page(id, title, body) {
      return `
        <article class="report-page ${id === activeId ? "active" : ""}" data-id="${id}">
          <h2 class="experiment-title">《建筑结构检测技术》实验报告<br>实验项目名称：${title}</h2>
          ${commonMeta()}
          ${actions(id)}
          ${body}
        </article>`;
    }

    function uploadBlock(id) {

    function showExperiment(id) {
      activeId = id;

      document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.nav === id));

    function valuesFor(prefix, count, mapper = i => `${prefix}_${i}`) {
      return Array.from({ length: count }, (_, i) => num(value(mapper(i)))).filter(Number.isFinite);
    }

    function value(key, id = activeId) {
      const el = document.querySelector(`.report-page[data-id="${id}"] [data-key="${key}"]`);
      return el ? el.value.trim() : "";
    }

    function setValue(key, val, id = activeId) {
      const el = document.querySelector(`.report-page[data-id="${id}"] [data-key="${key}"]`);
      if (el) el.value = val;
    }

    function num(v) {
      if (v === "" || v === null || v === undefined) return NaN;
      const n = Number(v);
      return Number.isFinite(n) ? n : NaN;
    }

    function mean(arr) {
      const data = arr.filter(Number.isFinite);
      return data.length ? data.reduce((a, b) => a + b, 0) / data.length : NaN;
    }

    function sampleStd(arr) {
      const data = arr.filter(Number.isFinite);
      if (data.length < 2) return NaN;
      const m = mean(data);
      return Math.sqrt(data.reduce((s, x) => s + (x - m) ** 2, 0) / (data.length - 1));
    }

    function fmt(n, digits = 2) {
      return Number.isFinite(n) ? n.toFixed(digits) : "";
    }

    function sciTex(n, digits = 2) {
      if (!Number.isFinite(n) || n === 0) return "0";
      const exponent = Math.floor(Math.log10(Math.abs(n)));
      const mantissa = n / 10 ** exponent;
      return `${fmt(mantissa, digits)}\\times10^{${exponent}}`;
    }

    function texSum(arr, digits = 1) {
      return arr.length ? arr.map(v => fmt(v, digits)).join(" + ") : "\\cdots";
    }

    function texValue(n, digits = 1, fallback = "\\cdots") {
      return Number.isFinite(n) ? fmt(n, digits) : fallback;
    }

    function round1(n) { return Number.isFinite(n) ? Math.round(n * 10) / 10 : NaN; }

    function interpPoints(points, x) {
      if (!Number.isFinite(x)) return NaN;
      if (x <= points[0][0]) return points[0][1];
      for (let i = 1; i < points.length; i++) {
        const [x0, y0] = points[i - 1];
        const [x1, y1] = points[i];
        if (x <= x1) return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
      }
      return points[points.length - 1][1];
    }

    function pumpCorrection(reboundMean, carbonationDepth) {
      if (!Number.isFinite(reboundMean) || !Number.isFinite(carbonationDepth)) return NaN;
      const d = Math.round(Math.max(0, carbonationDepth) * 2) / 2;
      if (d > 2) return NaN;
      if (d <= 1) return interpPoints([[40, 4.5], [45, 3.0], [50, 1.5], [55, 0]], reboundMean);
      return interpPoints([[30, 3.0], [35, 1.5], [40, 0]], reboundMean);
    }

    const angleTable = {
      20: { "90": -6, "60": -5, "45": -4, "30": -3, "-30": 2.5, "-45": 3, "-60": 3.5, "-90": 4 },
      30: { "90": -5, "60": -4, "45": -3.5, "30": -2.5, "-30": 2, "-45": 2.5, "-60": 3, "-90": 3.5 },
      40: { "90": -4, "60": -3.5, "45": -3, "30": -2, "-30": 1.5, "-45": 2, "-60": 2.5, "-90": 3 },
      50: { "90": -3.5, "60": -3, "45": -2.5, "30": -1.5, "-30": 1, "-45": 1.5, "-60": 2, "-90": 2.5 }
    };

    const faceTable = {
      top: { 20: 2.5, 25: 2, 30: 1.5, 35: 1, 40: 0.5, 45: 0, 50: 0 },
      bottom: { 20: -3, 25: -2.5, 30: -2, 35: -1.5, 40: -1, 45: -0.5, 50: 0 }
    };

    function interpTable(table, x, key) {
      if (!Number.isFinite(x) || !key || key === "0") return 0;
      const xs = Object.keys(table).map(Number).sort((a, b) => a - b);
      const pick = mark => {
        const item = table[mark];
        return typeof item === "number" ? item : (item?.[key] ?? 0);
      };
      if (x <= xs[0]) return pick(xs[0]);
      if (x >= xs[xs.length - 1]) return pick(xs[xs.length - 1]);
      for (let i = 1; i < xs.length; i++) {
        if (x <= xs[i]) {
          const x0 = xs[i - 1], x1 = xs[i];
          const y0 = pick(x0), y1 = pick(x1);
          return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
        }
      }
      return 0;
    }

    function calculate(id = activeId) {
      collectInputs();
      const map = {
        rebound: calcRebound,
        crack: calcCrack,
        carbonation: calcCarbonation,
        cover: calcCover,
        pile: calcPile,
        bridge: calcBridge
      };
      if (map[id]) map[id]();
      else drawEmpty(`${id}Chart`, "本实验以报告填写和图片记录为主。");
    }

    function calcRebound() {
      const page = document.querySelector('[data-id="rebound"]');
      const angle = value("angle", "rebound") || "0";
      const face = value("pourFace", "rebound") || "side";
      const strengthMode = value("strengthMode", "rebound") || "auto";
      const pumpMode = value("pumpMode", "rebound") || "auto";
      const avgCarb = num(value("carbonationAvg", "rebound"));
      const useAverageCarbonation = Number.isFinite(avgCarb) && avgCarb >= 0 && avgCarb <= 2;
      const strengths = [];
      const strengthSeries = [];
      const reboundMeans = [];
      const corePairs = [];
      const autoWarnings = new Set();
      for (let c = 0; c < 10; c++) {
        const vals = Array.from({ length: 16 }, (_, r) => num(value(`r_${r}_${c}`, "rebound"))).filter(Number.isFinite);
        let rm = NaN;
        if (vals.length >= 10) {
          const sorted = [...vals].sort((a, b) => a - b);
          rm = round1(mean(sorted.slice(3, -3)));
          setValue(`rebound_calc_0_${c}`, fmt(rm, 1), "rebound");
          reboundMeans.push(rm);
        }
        const angleFix = interpTable(angleTable, rm, angle);
        if (Number.isFinite(rm)) setValue(`rebound_calc_1_${c}`, fmt(angleFix, 2), "rebound");
        const afterAngle = Number.isFinite(rm) ? rm + angleFix : NaN;
        const faceFix = face === "side" ? 0 : interpTable(faceTable[face], rm, Number.isFinite(rm) ? face : "");
        if (Number.isFinite(rm)) setValue(`rebound_calc_2_${c}`, fmt(faceFix, 2), "rebound");
        let carb = num(value(`rebound_calc_3_${c}`, "rebound"));
        if (useAverageCarbonation) {
          carb = avgCarb;
          setValue(`rebound_calc_3_${c}`, fmt(avgCarb, 1), "rebound");
        } else if (!Number.isFinite(carb) && Number.isFinite(avgCarb)) {
          carb = avgCarb;
          setValue(`rebound_calc_3_${c}`, fmt(avgCarb, 1), "rebound");
        }
        const correctedR = Number.isFinite(afterAngle) ? afterAngle + faceFix : NaN;
        let tableStrength = NaN;
        if (strengthMode === "auto") {
          const baseStrength = correctedR;
          let pump = NaN;
          if (pumpMode === "none") {
            pump = 0;
            setValue(`rebound_calc_4_${c}`, fmt(pump, 2), "rebound");
          } else if (pumpMode === "auto") {
            pump = pumpCorrection(rm, carb);
            if (Number.isFinite(pump)) {
              setValue(`rebound_calc_4_${c}`, fmt(pump, 2), "rebound");
            } else if (Number.isFinite(baseStrength) && Number.isFinite(carb) && carb > 2) {
              setValue(`rebound_calc_4_${c}`, "", "rebound");
              autoWarnings.add("碳化深度大于 2.0mm 的测区，指导书要求采用同条件试件或钻芯修正，泵送修正值未自动套用。");
            }
          } else {
            pump = num(value(`rebound_calc_4_${c}`, "rebound"));
          }
          tableStrength = Number.isFinite(baseStrength) ? baseStrength + (Number.isFinite(pump) ? pump : 0) : NaN;
          if (Number.isFinite(tableStrength)) setValue(`rebound_calc_5_${c}`, fmt(tableStrength, 1), "rebound");
        } else {
          tableStrength = num(value(`rebound_calc_5_${c}`, "rebound"));
          if (pumpMode === "auto") {
            const pump = pumpCorrection(rm, carb);
            if (Number.isFinite(pump)) setValue(`rebound_calc_4_${c}`, fmt(pump, 2), "rebound");
          }
        }
        if (Number.isFinite(tableStrength)) {
          strengths.push(tableStrength);
          strengthSeries.push({ x: c + 1, y: tableStrength });
          if (Number.isFinite(rm) && tableStrength !== 0) corePairs.push({ rm, strength: tableStrength, ratio: rm / tableStrength });
        }
      }
      const coreFactor = mean(corePairs.map(pair => pair.ratio));
      if (Number.isFinite(coreFactor)) setValue("coreFactor", fmt(coreFactor, 2), "rebound");
      const avg = mean(strengths);
      const sd = sampleStd(strengths);
      const minF = strengths.length ? Math.min(...strengths) : NaN;
      let estimate = NaN;
      if (!strengths.some(v => v < 10) && strengths.length > 0 && strengths.length < 10) {
        estimate = minF;
      } else if (!strengths.some(v => v < 10) && strengths.length >= 10) {
        estimate = avg - 1.645 * sd;
      }
      const reboundEmpty = "待输入每测区回弹值和强度换算值。";
      if (strengths.length) {
        setResultHtml("reboundCoreResult", `<div class="formula-output">${
          formulaStatement("同条件试块修正系数（7-17）", "原公式按指导书保留；代入时用已有的回弹平均值与强度换算值作对应比值展示。", "\\eta=\\frac{1}{n}\\sum_{i=1}^{n}\\frac{f_{cu,i}}{f_{cu,i}^{c}}")
        }${
          formulaLine("修正系数", "\\eta", `\\frac{${ratioTexPairs(corePairs)}}{${corePairs.length}}`, fmt(coreFactor, 2))
        }${noteBlock("式中 fcu,i 为第 i 个同条件试块抗压强度，fcuc,i 为对应部位回弹强度换算值。本报告按课堂简化，用已知回弹平均值代入 fcu,i 位置展示计算过程；该系数不再反向改变上表强度换算值。")}</div>`);
        setResultHtml("reboundMeanResult", `<div class="formula-output">${
          formulaLine("强度换算值平均值", "m_{fcu}=\\frac{\\sum f_{cu,i}^{c}}{n}", `\\frac{${texSum(strengths, 1)}}{${strengths.length}}`, `${fmt(avg, 1)}\\,\\mathrm{MPa}`)
        }${noteBlock(`其中 fcuc,i 为各测区混凝土强度换算值。${autoWarnings.size ? "\n" + [...autoWarnings].join("\n") : ""}`)}</div>`);
        setResultHtml("reboundStdResult", `<div class="formula-output">${
          formulaLine("强度换算值标准差", "S_{fcu}=\\sqrt{\\frac{\\sum (f_{cu,i}^{c})^2-n(m_{fcu})^2}{n-1}}", `\\sqrt{\\frac{\\sum (f_{cu,i}^{c})^2-${strengths.length}\\times ${fmt(avg, 1)}^2}{${strengths.length}-1}}`, `${fmt(sd, 2)}\\,\\mathrm{MPa}`)
        }</div>`);
        const estimateOriginal = strengths.some(v => v < 10)
          ? "f_{cu,i}^{c}<10.0\\,\\mathrm{MPa}\\Rightarrow f_{cu,e}<10.0\\,\\mathrm{MPa}"
          : strengths.length < 10
            ? "f_{cu,e}=f_{cu,min}^{c}"
            : "f_{cu,e}=m_{fcu}-1.645S_{fcu}";
        const estimateSub = strengths.some(v => v < 10)
          ? `${strengths.filter(v => v < 10).map(v => fmt(v, 1)).join(",")}\\,\\mathrm{MPa}<10.0\\,\\mathrm{MPa}`
          : strengths.length < 10
            ? `${fmt(minF, 1)}`
            : `${fmt(avg, 1)}-1.645\\times ${fmt(sd, 2)}`;
        const ruleStatement = strengths.some(v => v < 10)
          ? formulaStatement("强度推定规则", "存在测区强度换算值小于 10.0MPa，强度推定值记为小于 10.0MPa。", "f_{cu,e}<10.0\\,\\mathrm{MPa}")
          : strengths.length < 10
            ? formulaStatement("强度推定规则", "测区数少于 10 个，强度推定值取最小测区强度换算值。", "f_{cu,e}=f_{cu,min}^{c}")
            : formulaStatement("强度推定规则", "测区数不少于 10 个，强度推定值 = 平均值 - 1.645 × 标准差。", "f_{cu,e}=m_{fcu}-1.645S_{fcu}");
        setResultHtml("reboundEstimateResult", `<div class="formula-output">${
          formulaLine("强度推定值", estimateOriginal, estimateSub, strengths.some(v => v < 10) ? "<10.0\\,\\mathrm{MPa}" : `${fmt(estimate, 1)}\\,\\mathrm{MPa}`)
        }${ruleStatement}${
          formulaStatement("回弹平均值原公式", "剔除 3 个最大值和 3 个最小值后，取余下 10 个有效回弹值平均。", "R_{ma}=\\frac{\\sum_{i=1}^{10}R_i}{10}")
        }${
          formulaStatement("修正值查表依据", "角度修正值、浇筑面修正值、泵送修正值均按测区回弹平均值查表。", "\\Delta R_a,\\ \\Delta R_s,\\ K\\ \\Leftarrow\\ R_{ma}")
        }${
          formulaStatement("课堂简化强度换算", "强度换算值按回弹平均值与各修正值直接相加。", "f_{cu,i}^{c}=R_{ma}+\\Delta R_a+\\Delta R_s+K")
        }</div>`);
      } else {
        setResultHtml("reboundCoreResult", "待输入强度计算表数据。");
        setResultHtml("reboundMeanResult", reboundEmpty);
        setResultHtml("reboundStdResult", reboundEmpty);
        setResultHtml("reboundEstimateResult", reboundEmpty);
      }
      drawLineChart("reboundChart", [
        { name: "回弹平均值", data: reboundMeans.map((y, i) => ({ x: i + 1, y })) },
        { name: "强度换算值", data: strengthSeries }
      ], "测区编号", "数值");
      return strengthSeries.map(p => ({ 测区: p.x, 强度换算值: fmt(p.y, 2) }));
    }

    function calcCrack() {
      const rows = [];
      for (let i = 0; i < 6; i++) {
        const l = num(value(`crack_l_${i}`, "crack"));
        const tn = num(value(`crack_tn_${i}`, "crack"));
        const tc = num(value(`crack_tc_${i}`, "crack"));
        if (Number.isFinite(l) && Number.isFinite(tn)) rows.push({ i, l, tn, tc });
      }
      const valid = rows.filter(r => Number.isFinite(r.l) && Number.isFinite(r.tn));
      let velocity = NaN;
      if (valid.length >= 2) {
        const first = valid[0], last = valid[valid.length - 1];
        velocity = (last.l - first.l) / (last.tn - first.tn);
      }
      const depths = [];
      rows.forEach(r => {
        let h = NaN;
        if (Number.isFinite(velocity) && Number.isFinite(r.tc) && r.l > 0) {
          const term = (r.tc * velocity / r.l) ** 2 - 1;
          h = term >= 0 ? r.l / 2 * Math.sqrt(term) : NaN;
        }
        const cell = document.querySelector(`[data-crack-h="${r.i}"]`);
        if (cell) cell.textContent = fmt(h, 1);
        if (Number.isFinite(h)) depths.push(h);
      });
      const avgH = mean(depths);
      const depthList = depths.map(v => fmt(v, 1)).join("、");
      const firstValid = valid[0];
      const lastValid = valid[valid.length - 1];
      setResultHtml("crackResult", depths.length
        ? `<div class="formula-output">
            ${formulaLine("不跨缝平测声速", "v=\\frac{l_n'-l_1'}{t_n'-t_1'}", `\\frac{${texValue(lastValid?.l, 1)}-${texValue(firstValid?.l, 1)}}{${texValue(lastValid?.tn, 1)}-${texValue(firstValid?.tn, 1)}}`, `${fmt(velocity, 3)}\\,\\mathrm{mm/\\mu s}`)}
            ${formulaLine("裂缝深度平均值", "m_{bc}=\\frac{\\sum h_{ci}}{n}", `\\frac{${texSum(depths, 1)}}{${depths.length}}`, `${fmt(avgH, 1)}\\,\\mathrm{mm}`)}
            ${noteBlock(`单点裂缝深度原公式：hci = li / 2 × √[(ti0 × v / li)^2 - 1]\n结论：该裂缝深度可暂取 hc = ${fmt(avgH, 1)} mm，最终应结合首波反相情况和异常数据剔除要求确定。`)}
          </div>`
        : "待输入不跨缝、跨缝声时和测距。");
      drawLineChart("crackChart", [
        { name: "不跨缝声时", data: rows.filter(r => Number.isFinite(r.tn)).map(r => ({ x: r.l, y: r.tn })) },
        { name: "跨缝声时", data: rows.filter(r => Number.isFinite(r.tc)).map(r => ({ x: r.l, y: r.tc })) },
        { name: "裂缝深度", data: depths.map((y, i) => ({ x: rows[i]?.l ?? i + 1, y })) }
      ], "测距 / mm", "声时 μs 或深度 mm");
      return rows.map(r => ({ 测距: r.l, 不跨缝声时: r.tn, 跨缝声时: r.tc }));
    }

    function calcCarbonation() {
      const avgs = [];
      const all = [];
      for (let i = 0; i < 6; i++) {

        const avg = mean(vals);

        if (cell) cell.textContent = fmt(avg, 1);
        if (Number.isFinite(avg)) avgs.push({ x: i + 1, y: avg });
        all.push(...vals);
      }
      setResultHtml("carbonationResult", all.length
        ? `<div class="formula-output">
            ${formulaLine("碳化深度最大值", "d_{max}=\\max(d_i)", `\\max(${all.map(v => fmt(v, 1)).join(",")})`, `${fmt(Math.max(...all), 1)}\\,\\mathrm{mm}`)}
            ${formulaLine("碳化深度最小值", "d_{min}=\\min(d_i)", `\\min(${all.map(v => fmt(v, 1)).join(",")})`, `${fmt(Math.min(...all), 1)}\\,\\mathrm{mm}`)}
            ${formulaLine("碳化深度平均值", "d_m=\\frac{\\sum d_i}{n}", `\\frac{${texSum(all, 1)}}{${all.length}}`, `${fmt(mean(all), 1)}\\,\\mathrm{mm}`)}
            ${noteBlock("记录说明：酚酞未变色处为已碳化混凝土，测量值精确至 1mm。")}
          </div>`
        : "待输入碳化深度测孔值。");
      drawBarChart("carbonationChart", avgs, "测区", "平均碳化深度 / mm");

    function calcCover() {
      const design = num(value("cover_design", "cover"));
      const vals = valuesFor("cover_d", 15, i => `cover_d_${i}`);
      const n = vals.length;
      const avg = mean(vals);
      const sd = sampleStd(vals);
      const kp = n >= 25 ? 0.595 : n >= 16 ? 1.645 : n >= 10 ? 1.695 : NaN;
      const dne = avg - kp * sd;
      const ratio = dne / design;
      let scale = "", effect = "";
      if (Number.isFinite(ratio)) {
        if (ratio > 0.95) [scale, effect] = ["1", "影响不显著"];
        else if (ratio > 0.85) [scale, effect] = ["2", "有轻度影响"];
        else if (ratio > 0.70) [scale, effect] = ["3", "有影响"];
        else if (ratio > 0.55) [scale, effect] = ["4", "有较大影响"];
        else [scale, effect] = ["5", "钢筋易失去碱性保护，发生锈蚀"];
      }
      setResultHtml("coverResult", vals.length
        ? `<div class="formula-output">
            ${formulaLine("平均保护层厚度", "D_n=\\frac{\\sum D_{ni}}{n}", `\\frac{${texSum(vals, 1)}}{${n}}`, `${fmt(avg, 1)}\\,\\mathrm{mm}`)}
            ${formulaLine("实测标准差", "S_D=\\sqrt{\\frac{\\sum D_{ni}^2-nD_n^2}{n-1}}", `\\sqrt{\\frac{\\sum D_{ni}^2-${n}\\times ${fmt(avg, 1)}^2}{${n}-1}}`, `${fmt(sd, 1)}\\,\\mathrm{mm}`)}
            ${formulaLine("保护层厚度特征值", "D_{ne}=D_n-K_pS_D", `${fmt(avg, 1)}-${Number.isFinite(kp) ? kp : "K_p"}\\times ${fmt(sd, 1)}`, `${fmt(dne, 1)}\\,\\mathrm{mm}`)}
            ${formulaLine("评定指标", "\\frac{D_{ne}}{D_{nd}}", `\\frac{${fmt(dne, 1)}}{${texValue(design, 1)}}`, `${fmt(ratio, 3)}`)}
            ${noteBlock(`Kp = ${Number.isFinite(kp) ? kp : "测点数少于 10，需补充测点"}\n评定标度：${scale || "待输入设计值或补充测点"} ${effect}`)}
          </div>`
        : "待输入钢筋保护层厚度实测值。");
      drawBarChart("coverChart", vals.map((y, i) => ({ x: i + 1, y })), "测点", "保护层厚度 / mm", Number.isFinite(design) ? design : undefined);
      return vals.map((v, i) => ({ 测点: i + 1, 保护层厚度: fmt(v, 1) }));
    }

    function calcPile() {
      const l = num(value("pile_l", "pile"));
      const t0 = num(value("pile_t0", "pile")) || 0;
      const tp = num(value("pile_tp", "pile")) || 0;
      const a0 = num(value("pile_a0", "pile")) || 1;
      const rows = [];
      for (let i = 0; i < 16; i++) {
        const z = num(value(`pile_z_${i}`, "pile"));
        const ti = num(value(`pile_t_${i}`, "pile"));
        const ai = num(value(`pile_a_${i}`, "pile"));
        const T = num(value(`pile_T_${i}`, "pile"));
        if ([z, ti].some(Number.isFinite)) {
          const tc = ti - t0 - tp;
          const v = Number.isFinite(l) && tc > 0 ? l / tc : NaN;
          const Ap = ai > 0 && a0 > 0 ? 20 * Math.log10(ai / a0) : NaN;
          const f = T > 0 ? 1000 / T : NaN;
          rows.push({ i, z, ti, tc, v, Ap, f });
          setCell(`[data-pile-v="${i}"]`, fmt(v, 2));
          setCell(`[data-pile-Ap="${i}"]`, fmt(Ap, 2));
          setCell(`[data-pile-f="${i}"]`, fmt(f, 2));
        }
      }
      const vs = rows.map(r => r.v).filter(Number.isFinite);
      const aps = rows.map(r => r.Ap).filter(Number.isFinite);
      const vm = mean(vs);
      const vc = vs.length >= 2 ? mean(vs) - 1.645 * sampleStd(vs) : NaN;
      const sx = sampleStd(vs);
      const am = mean(aps);
      const abnormalV = rows.filter(r => Number.isFinite(vc) && r.v <= vc);
      const abnormalA = rows.filter(r => Number.isFinite(am) && r.Ap < am - 6);
      setResultHtml("pileResult", rows.length
        ? `<div class="formula-output">
            ${formulaLine("测点声时", "t_{ci}=t_i-t_0-t'", "t_i-t_0-t'", "\\text{见上表}", "各测点按本式逐行计算。")}
            ${formulaLine("测点声速", "v_i=\\frac{l'}{t_{ci}}", `\\frac{${fmt(l, 1)}}{t_{ci}}`, "\\text{见上表}", "各测点按本式逐行计算。")}
            ${formulaLine("测点波幅", "A_{pi}=20\\lg\\frac{a_i}{a_0}", `20\\lg\\frac{a_i}{${fmt(a0, 3)}}`, "\\text{见上表}", "各测点按本式逐行计算。")}
            ${formulaLine("测点主频", "f_i=\\frac{1000}{T_i}", "\\frac{1000}{T_i}", "\\text{见上表}", "各测点按本式逐行计算。")}
            ${formulaLine("平均声速", "v_m=\\frac{\\sum v_i}{n}", `\\frac{\\sum v_i}{${rows.length}}`, `${fmt(vm, 2)}\\,\\mathrm{km/s}`)}
            ${formulaLine("声速标准差", "s_x=\\sqrt{\\frac{\\sum (v_i-v_m)^2}{n-1}}", `\\sqrt{\\frac{\\sum (v_i-${fmt(vm, 2)})^2}{${rows.length}-1}}`, `${fmt(sx, 2)}\\,\\mathrm{km/s}`)}
            ${formulaLine("声速异常判断参考值", "v_0=v_m-\\lambda s_x", `${fmt(vm, 2)}-1.645\\times ${fmt(sx, 2)}`, `${fmt(vc, 2)}\\,\\mathrm{km/s}`)}
            ${formulaLine("波幅异常阈值", "A_{pi}<A_m-6", `${fmt(am, 2)}-6`, `${fmt(am - 6, 2)}\\,\\mathrm{dB}`)}
            ${noteBlock(`声速异常测点：${abnormalV.map(r => r.i + 1).join("、") || "未见明显异常"}\n波幅异常测点：${abnormalA.map(r => r.i + 1).join("、") || "未见明显异常"}\n初步判定：${abnormalV.length || abnormalA.length ? "存在可疑测点，应结合波形、PSD、主频和加密测试综合判定桩身完整性类别。" : "各声学参数未见明显异常，可暂按完整性较好记录。"}`)}
          </div>`
        : "待输入基桩声测数据。");
      drawLineChart("pileChart", [
        { name: "声速 v", data: rows.filter(r => Number.isFinite(r.v)).map(r => ({ x: r.z, y: r.v })) },
        { name: "波幅 Ap", data: rows.filter(r => Number.isFinite(r.Ap)).map(r => ({ x: r.z, y: r.Ap })) },
        { name: "主频 f", data: rows.filter(r => Number.isFinite(r.f)).map(r => ({ x: r.z, y: r.f })) }
      ], "深度 / m", "声学参数");
      return rows;
    }

    function setCell(selector, text) {

    function bridgeSectionValues() {
      const B = 1600, hf = 80, bw = 100, hw = 370, n = 4;
      const Af = B * hf;
      const Aw = n * bw * hw;
      const A = Af + Aw;
      const yf = hf / 2;
      const yw = hf + hw / 2;
      const ybar = (Af * yf + Aw * yw) / A;
      const If0 = B * hf ** 3 / 12;
      const Iw0 = n * bw * hw ** 3 / 12;
      const If = If0 + Af * (ybar - yf) ** 2;
      const Iw = Iw0 + Aw * (yw - ybar) ** 2;
      const I = If + Iw;
      const h = hf + hw;
      const yBottom = h - ybar;
      return { B, hf, bw, hw, n, Af, Aw, A, yf, yw, ybar, If0, Iw0, If, Iw, I, h, yBottom };
    }

      const s = bridgeSectionValues();
      return `<div class="formula-output">

        ${formulaLine("截面面积", "A", `${s.B}\\times${s.hf}+4\\times${s.bw}\\times${s.hw}`, `${fmt(s.A, 0)}\\,\\mathrm{mm^2}`)}

        ${formulaLine("顶板自身惯性矩", "I_1=\\frac{bh^3}{12}", `\\frac{${s.B}\\times${s.hf}^3}{12}`, `${sciTex(s.If0, 2)}\\,\\mathrm{mm^4}`)}
        ${formulaLine("腹板自身惯性矩", "I_2=4\\times\\frac{bh^3}{12}", `4\\times\\frac{${s.bw}\\times${s.hw}^3}{12}`, `${sciTex(s.Iw0, 2)}\\,\\mathrm{mm^4}`)}
        ${formulaLine("截面惯性矩", "I_x=I_1+A_f(\\bar y-y_f)^2+I_2+A_w(y_w-\\bar y)^2", `${sciTex(s.If0, 2)}+${fmt(s.Af, 0)}\\times(${fmt(s.ybar, 2)}-${fmt(s.yf, 1)})^2+${sciTex(s.Iw0, 2)}+${fmt(s.Aw, 0)}\\times(${fmt(s.yw, 1)}-${fmt(s.ybar, 2)})^2`, `${sciTex(s.I, 2)}\\,\\mathrm{mm^4}`)}

      </div>`;
    }

    function bridgeErrorAnalysisHtml(last, strainAvg, strainTheory, strainErr, deflAvgAbs, deflTheory, deflErrAbs) {
      if (!last) return "待输入静载实验数据。";
      const strainLevel = Math.abs(strainErr) > 50 ? "明显偏大" : Math.abs(strainErr) > 20 ? "较大" : "较小";
      const deflLevel = Math.abs(deflErrAbs) > 50 ? "明显偏大" : Math.abs(deflErrAbs) > 20 ? "较大" : "较小";
      const strainDirection = strainErr > 0 ? "大于" : "小于";
      const deflDirection = deflErrAbs > 0 ? "大于" : "小于";
      return `<div class="formula-output">
        ${formulaStatement("误差分析依据", "按最大级荷载下实测平均值与理论值比较。挠度仪读数含方向，误差分析按挠度绝对值比较变形大小。", "\\eta=\\frac{x_{\\text{实测}}-x_{\\text{理论}}}{x_{\\text{理论}}}\\times100\\%")}
        ${formulaLine("应变相对误差", "\\eta_\\varepsilon", `\\frac{${fmt(strainAvg, 1)}-${fmt(strainTheory, 1)}}{${fmt(strainTheory, 1)}}\\times100\\%`, `${fmt(strainErr, 2)}\\%`)}
        ${formulaLine("挠度相对误差", "\\eta_f", `\\frac{${fmt(deflAvgAbs, 3)}-${fmt(deflTheory, 3)}}{${fmt(deflTheory, 3)}}\\times100\\%`, `${fmt(deflErrAbs, 2)}\\%`)}
        ${noteBlock(`最大级荷载 P = ${fmt(last.load, 1)} kN。应变误差${strainLevel}，实测平均应变${strainDirection}理论应变；挠度误差${deflLevel}，实测挠度绝对值${deflDirection}理论计算值。\n主要原因可归纳为：1. 本组应变测点不是同一截面，包含 1/2 跨、1/4 跨外侧、1/4 跨内侧和支座处，应按各测点所在截面的弯矩分别比较，不能直接套用别组的采集读数。2. 加载钢条或垫条可能与梁面接触不密实，加载过程中若出现局部撬起、滑移或偏心受压，会使荷载没有完全按理论位置传递，导致应变和挠度偏离理论值。3. 应变片不一定贴在截面最外侧受拉或受压边缘，若离最外缘有距离，实际测得应变会小于按最外缘距离 y 计算的理论应变；应变片角度偏差、粘贴不牢和导线接触也会放大误差。4. 支座处理论弯矩近似为 0，读数容易受局部约束、支座摩擦、支座转动不充分和贴片位置影响；与跨中和 1/4 跨测点一起平均时，会拉低整体实测应变。5. 1/4 跨外侧、内侧位于不同梁或不同横向位置，实际 4 根 T 梁横向分配不完全均匀，外侧梁与内侧梁受力差别会造成两点读数差异。6. 理论计算采用简化梁模型和等效截面，实际横隔梁连接、混凝土已有微裂缝、加载接触面积、仪器调零、读数回零、持荷时间和温度漂移都会影响结果。\n结论：本次静载理论值与实测值差异主要来自加载接触条件、应变片位置、测点位置差异、横向分配不均和现场测试条件。判断结果时应重点看各级荷载下应变、挠度随荷载增加的变化趋势是否基本一致，而不是只依据别组数据或单个测点读数。`)}</div>`;
    }

    function calcBridge() {
      setResultHtml("bridgeSectionResult", bridgeSectionHtml());
      const staticRows = [];
      for (let i = 0; i < 3; i++) {
        const load = num(value(`bridge_load_${i}`, "bridge"));
        const strains = ["mid", "q_out", "q_in", "support"].map(key => num(value(`bridge_strain_${key}_${i}`, "bridge")));
        const defls = ["q_out", "q_in"].map(key => num(value(`bridge_defl_${key}_${i}`, "bridge")));
        if ([load, ...strains, ...defls].some(Number.isFinite)) staticRows.push({ i, load, strains, defls });
      }
      const last = staticRows[staticRows.length - 1];
      const section = bridgeSectionValues();
      const bridgeSpan = 6;
      const bridgeE = 3.25e4;
      const theoryAtLoad = load => {
        if (!Number.isFinite(load)) return {};
        const Mmid = load * bridgeSpan / 4;
        const Mq = load * bridgeSpan / 8;
        const sigmaMid = Mmid * 1e6 * section.yBottom / section.I;
        const sigmaQ = Mq * 1e6 * section.yBottom / section.I;
        const strainMid = sigmaMid / bridgeE * 1e6;
        const strainQ = sigmaQ / bridgeE * 1e6;
        const strainAvg = (strainMid + strainQ + strainQ + 0) / 4;
        return { Mmid, Mq, sigmaMid, sigmaQ, strainMid, strainQ, strainAvg };
      };
      const theoryRows = staticRows.map(r => theoryAtLoad(r.load));
      const theoryStrain = theoryRows.map(r => r.strainMid);
      const theoryStress = theoryRows.map(r => r.sigmaMid);
      const theoryDeflQ = staticRows.map(r => 0.3 * r.load / 36);
      const measuredStrains = last?.strains.filter(Number.isFinite) || [];
      const measuredDefls = last?.defls.filter(Number.isFinite) || [];
      const strainAvg = mean(measuredStrains);
      const deflAvg = mean(measuredDefls);
      const deflAvgAbs = mean(measuredDefls.map(Math.abs));
      const lastTheory = last ? theoryAtLoad(last.load) : {};
      const ts = lastTheory.strainAvg;
      const td = last ? theoryDeflQ[last.i] : NaN;
      const strainErr = Number.isFinite(ts) && ts !== 0 ? (strainAvg - ts) / ts * 100 : NaN;
      const deflErrAbs = Number.isFinite(td) && td !== 0 ? (deflAvgAbs - td) / td * 100 : NaN;
      const loadListTex = staticRows.map(r => fmt(r.load, 1)).join(",");
      setResultHtml("bridgeStaticResult", staticRows.length
        ? `<div class="formula-output">
            ${formulaStatement("分级加载", "本次静载试验采用 3 级累计加载，按表中实际荷载计算。", `P=${loadListTex}\\,\\mathrm{kN}`)}
            ${formulaStatement("理论计算参数", "参考别组报告的做法，最大级荷载下按简支梁弯矩和本组截面惯性矩计算各测点理论应力、理论应变。", `L=${bridgeSpan}\\,\\mathrm{m},\\ E=${sciTex(bridgeE, 2)}\\,\\mathrm{MPa},\\ I_x=${sciTex(section.I, 2)}\\,\\mathrm{mm^4},\\ y=${fmt(section.yBottom, 2)}\\,\\mathrm{mm}`)}
            ${formulaLine("跨中测点弯矩", "M_1=\\frac{PL}{4}", `\\frac{${fmt(last.load, 1)}\\times${bridgeSpan}}{4}`, `${fmt(lastTheory.Mmid, 2)}\\,\\mathrm{kN\\cdot m}`)}
            ${formulaLine("跨中测点理论应力", "\\sigma_1=\\frac{M_1y}{I_x}", `\\frac{${fmt(lastTheory.Mmid, 2)}\\times10^6\\times${fmt(section.yBottom, 2)}}{${sciTex(section.I, 2)}}`, `${fmt(lastTheory.sigmaMid, 2)}\\,\\mathrm{MPa}`)}
            ${formulaLine("跨中测点理论应变", "\\varepsilon_1=\\frac{\\sigma_1}{E}\\times10^6", `\\frac{${fmt(lastTheory.sigmaMid, 2)}}{${sciTex(bridgeE, 2)}}\\times10^6`, `${fmt(lastTheory.strainMid, 1)}\\,\\mu\\varepsilon`)}
            ${formulaLine("1/4 跨测点弯矩", "M_{2,3}=\\frac{PL}{8}", `\\frac{${fmt(last.load, 1)}\\times${bridgeSpan}}{8}`, `${fmt(lastTheory.Mq, 2)}\\,\\mathrm{kN\\cdot m}`)}
            ${formulaLine("1/4 跨测点理论应力", "\\sigma_{2,3}=\\frac{M_{2,3}y}{I_x}", `\\frac{${fmt(lastTheory.Mq, 2)}\\times10^6\\times${fmt(section.yBottom, 2)}}{${sciTex(section.I, 2)}}`, `${fmt(lastTheory.sigmaQ, 2)}\\,\\mathrm{MPa}`)}
            ${formulaLine("1/4 跨测点理论应变", "\\varepsilon_{2,3}=\\frac{\\sigma_{2,3}}{E}\\times10^6", `\\frac{${fmt(lastTheory.sigmaQ, 2)}}{${sciTex(bridgeE, 2)}}\\times10^6`, `${fmt(lastTheory.strainQ, 1)}\\,\\mu\\varepsilon`)}
            ${formulaStatement("支座测点理论值", "支座处按简化模型取弯矩为 0。", "M_4=0,\\ \\sigma_4=0,\\ \\varepsilon_4=0")}
            ${formulaLine("最大级平均实测应变", "\\bar\\varepsilon=\\frac{\\sum\\varepsilon_i}{n}", `\\frac{${texSum(measuredStrains, 1)}}{${measuredStrains.length || "n"}}`, `${fmt(strainAvg, 1)}\\,\\mu\\varepsilon`)}
            ${formulaLine("对应测点理论平均应变", "\\bar\\varepsilon_t=\\frac{\\varepsilon_1+\\varepsilon_2+\\varepsilon_3+\\varepsilon_4}{4}", `\\frac{${fmt(lastTheory.strainMid, 1)}+${fmt(lastTheory.strainQ, 1)}+${fmt(lastTheory.strainQ, 1)}+0}{4}`, `${fmt(ts, 1)}\\,\\mu\\varepsilon`)}
            ${formulaLine("应变平均误差", "\\eta_\\varepsilon=\\frac{\\bar\\varepsilon-\\bar\\varepsilon_t}{\\bar\\varepsilon_t}\\times100\\%", `\\frac{${fmt(strainAvg, 1)}-${fmt(ts, 1)}}{${fmt(ts, 1)}}\\times100\\%`, `${fmt(strainErr, 2)}\\%`)}
            ${formulaLine("1/4 跨理论挠度", "f_t(P)=0.3\\times\\frac{P}{36}", `0.3\\times\\frac{${fmt(last.load, 1)}}{36}`, `${fmt(td, 3)}\\,\\mathrm{mm}`)}
            ${formulaLine("1/4 跨平均实测挠度", "\\bar f=\\frac{f_{\\text{外侧}}+f_{\\text{内侧}}}{2}", `\\frac{${texSum(measuredDefls, 3)}}{${measuredDefls.length || "n"}}`, `${fmt(deflAvg, 3)}\\,\\mathrm{mm}`)}
            ${formulaLine("挠度绝对值误差", "\\eta_f=\\frac{|\\bar f|-f_t}{f_t}\\times100\\%", `\\frac{${fmt(deflAvgAbs, 3)}-${fmt(td, 3)}}{${fmt(td, 3)}}\\times100\\%`, `${fmt(deflErrAbs, 2)}\\%`)}
            ${noteBlock("测点布置：应变测点 4 个，分别为 1/2 跨、1/4 跨外侧、1/4 跨内侧、支座处；挠度仪 2 个，均布置在 1/4 跨处（外侧、靠内侧）。")}
          </div>`
        : "待输入静载实验数据。");
      setResultHtml("bridgeErrorResult", staticRows.length
        ? bridgeErrorAnalysisHtml(last, strainAvg, ts, strainErr, deflAvgAbs, td, deflErrAbs)
        : "待输入静载实验数据。");
      drawLineChart("bridgeStaticChart", [
        { name: "平均实测应变", data: staticRows.filter(r => Number.isFinite(r.load)).map(r => ({ x: r.load, y: mean(r.strains) })) },
        { name: "理论应变", data: staticRows.map(r => ({ x: r.load, y: theoryStrain[r.i] })) },
        { name: "1/4平均挠度", data: staticRows.filter(r => Number.isFinite(r.load)).map(r => ({ x: r.load, y: mean(r.defls) })) }
      ], "荷载 / kN", "应变 με 或挠度 mm");

      const dynRows = [];
      for (let i = 0; i < 3; i++) {
        const strain1 = num(value(`dyn_strain_1_${i}`, "bridge") || value(`dyn_strain_${i}`, "bridge"));
        const strain2 = num(value(`dyn_strain_2_${i}`, "bridge"));
        const deflA = num(value(`dyn_defl_a_${i}`, "bridge") || value(`dyn_defl_${i}`, "bridge"));
        const deflB = num(value(`dyn_defl_b_${i}`, "bridge"));
        const freq = num(value(`dyn_freq_${i}`, "bridge"));
        const damping = num(value(`dyn_damping_${i}`, "bridge"));
        if ([strain1, strain2, deflA, deflB, freq, damping].some(Number.isFinite)) dynRows.push({ i, strain1, strain2, deflA, deflB, freq, damping });
      }
      const freqs = dynRows.map(r => r.freq).filter(Number.isFinite);
      const dampings = dynRows.map(r => r.damping).filter(Number.isFinite);
      const dynStrains = dynRows.flatMap(r => [r.strain1, r.strain2]).filter(Number.isFinite);
      const dynDefls = dynRows.flatMap(r => [r.deflA, r.deflB]).filter(Number.isFinite);
      const theoryF = 18.49;
      const fAvg = mean(freqs);
      const fErr = (fAvg - theoryF) / theoryF * 100;
      const dampingAvg = mean(dampings);
      const strainAmp = dynStrains.length ? Math.max(...dynStrains.map(Math.abs)) : NaN;
      const deflAmp = dynDefls.length ? Math.max(...dynDefls.map(Math.abs)) : NaN;
      setResultHtml("bridgeDynamicResult", dynRows.length || parseSeries(value("timeSeries", "bridge")).length || parseSeries(value("fftSeries", "bridge")).length
        ? `<div class="formula-output">
            ${formulaLine("理论基频", "f_1=\\frac{\\pi}{2L^2}\\sqrt{\\frac{EI}{m}}", "\\text{由 MIDAS Civil 或实验指导书模型给出}", `${theoryF.toFixed(2)}\\,\\mathrm{Hz}`)}
            ${formulaLine("实测频率平均值", "f_m=\\frac{\\sum f_i}{n}", `\\frac{${freqs.length ? texSum(freqs, 2) : "\\cdots"}}{${freqs.length || "n"}}`, `${fmt(fAvg, 2)}\\,\\mathrm{Hz}`)}
            ${formulaLine("频率误差", "\\eta_f=\\frac{f_m-f_{\\text{理论}}}{f_{\\text{理论}}}\\times100\\%", `\\frac{${fmt(fAvg, 2)}-${theoryF.toFixed(2)}}{${theoryF.toFixed(2)}}\\times100\\%`, `${fmt(fErr, 2)}\\%`)}
            ${formulaLine("最大动应变幅值", "\\varepsilon_{d,max}=\\max|\\varepsilon_i|", dynStrains.length ? dynStrains.map(v => fmt(Math.abs(v), 3)).join(",") : "\\cdots", `${fmt(strainAmp, 3)}\\,\\mu\\varepsilon`)}
            ${formulaLine("最大动挠度幅值", "f_{d,max}=\\max|f_i|", dynDefls.length ? dynDefls.map(v => fmt(Math.abs(v), 3)).join(",") : "\\cdots", `${fmt(deflAmp, 3)}\\,\\mathrm{mm}`)}
            ${formulaLine("冲击系数", "\\mu=\\frac{y_{\\text{动}}}{y_{\\text{静}}}", "\\frac{\\text{动响应峰值}}{\\text{静响应值}}", "\\text{待结合跑车试验峰值计算}")}
            ${formulaLine("阻尼比平均值", "\\bar\\xi=\\frac{\\sum\\xi_i}{n}", `\\frac{${dampings.length ? texSum(dampings, 4) : "\\cdots"}}{${dampings.length || "n"}}`, `${fmt(dampingAvg, 4)}`)}
            ${formulaLine("半功率带宽法", "\\xi=\\frac{f_2-f_1}{2f_n}", "\\frac{\\text{半功率带宽上限频率}-\\text{下限频率}}{2\\times\\text{共振频率}}", "\\text{待由 FFT 图谱读取}")}
            ${noteBlock("对照别组报告，动载部分需要记录 3 次试验的应变幅值 1、应变幅值 2、挠度幅值 a、挠度幅值 b、频率和阻尼比；再画跨中应变时程曲线和 FFT 图谱。阻尼会消耗振动能量并影响结构振幅和衰减速度，实际桥梁阻尼来源包括材料内摩擦、支座内部摩擦、构件相对滑动、连接部位微小位移、空气阻尼和附属设施阻尼等。")}
          </div>`
        : "待输入动载实验数据。");
      const time = parseSeries(value("timeSeries", "bridge"));
      const fft = parseSeries(value("fftSeries", "bridge"));
      drawLineChart("bridgeDynamicChart", [
        { name: "跨中应变时程", data: time.map(p => ({ x: p[0], y: p[1] })) },
        { name: "FFT 幅值", data: fft.map(p => ({ x: p[0], y: p[1] })) }
      ], "时间 s 或频率 Hz", "应变 / 幅值");
      return [...staticRows, ...dynRows];
    }

    function parseSeries(text) {
      return String(text || "").split(/\n+/).map(line => line.trim()).filter(Boolean).map(line => {
        const parts = line.split(/[\s,，;；]+/).map(Number);
        return parts.length >= 2 && parts.every(Number.isFinite) ? [parts[0], parts[1]] : null;
      }).filter(Boolean);
    }

    function drawEmpty(canvasId, text = "待输入实验数据") {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#cbd5e1";
      ctx.strokeRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#64748b";
      ctx.font = "24px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
    }

    function drawLineChart(canvasId, series, xLabel, yLabel) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const clean = series.map(s => ({ ...s, data: s.data.filter(p => Number.isFinite(p.x) && Number.isFinite(p.y)) })).filter(s => s.data.length);
      if (!clean.length) return drawEmpty(canvasId);
      const ctx = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height;
      const pad = { l: 70, r: 22, t: 34, b: 58 };
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, W, H);
      const xs = clean.flatMap(s => s.data.map(p => p.x));
      const ys = clean.flatMap(s => s.data.map(p => p.y));
      let xmin = Math.min(...xs), xmax = Math.max(...xs), ymin = Math.min(...ys), ymax = Math.max(...ys);
      if (xmin === xmax) { xmin -= 1; xmax += 1; }
      if (ymin === ymax) { ymin -= 1; ymax += 1; }
      const yPad = (ymax - ymin) * 0.12;
      ymin -= yPad; ymax += yPad;
      const sx = x => pad.l + (x - xmin) / (xmax - xmin) * (W - pad.l - pad.r);
      const sy = y => H - pad.b - (y - ymin) / (ymax - ymin) * (H - pad.t - pad.b);
      drawAxes(ctx, W, H, pad, xLabel, yLabel, xmin, xmax, ymin, ymax);
      const colors = ["#1d4ed8", "#047857", "#b45309", "#b91c1c", "#7c3aed"];
      clean.forEach((s, idx) => {
        ctx.strokeStyle = colors[idx % colors.length];
        ctx.fillStyle = colors[idx % colors.length];
        ctx.lineWidth = 2;
        ctx.beginPath();
        s.data.forEach((p, i) => {
          const x = sx(p.x), y = sy(p.y);
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
        s.data.forEach(p => {
          ctx.beginPath();
          ctx.arc(sx(p.x), sy(p.y), 3.2, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.fillText(s.name, pad.l + idx * 145, 20);
      });
    }

    function drawBarChart(canvasId, data, xLabel, yLabel, reference) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const clean = data.filter(p => Number.isFinite(p.y));
      if (!clean.length) return drawEmpty(canvasId);
      const ctx = canvas.getContext("2d");
      const W = canvas.width, H = canvas.height;
      const pad = { l: 70, r: 22, t: 34, b: 58 };
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, W, H);
      const ys = clean.map(p => p.y).concat(Number.isFinite(reference) ? [reference] : []);
      const ymax = Math.max(...ys) * 1.25 || 1;
      const ymin = 0;
      drawAxes(ctx, W, H, pad, xLabel, yLabel, 1, clean.length, ymin, ymax);
      const innerW = W - pad.l - pad.r;
      const barW = Math.max(18, innerW / clean.length * 0.56);
      clean.forEach((p, i) => {
        const cx = pad.l + (i + 0.5) / clean.length * innerW;
        const y = H - pad.b - (p.y - ymin) / (ymax - ymin) * (H - pad.t - pad.b);
        ctx.fillStyle = "#1d4ed8";
        ctx.fillRect(cx - barW / 2, y, barW, H - pad.b - y);
        ctx.fillStyle = "#334155";
        ctx.textAlign = "center";
        ctx.fillText(String(p.x), cx, H - 34);
      });
      if (Number.isFinite(reference)) {
        const ry = H - pad.b - (reference - ymin) / (ymax - ymin) * (H - pad.t - pad.b);
        ctx.strokeStyle = "#b91c1c";
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(pad.l, ry);
        ctx.lineTo(W - pad.r, ry);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = "#b91c1c";
        ctx.fillText("设计值", W - pad.r - 40, ry - 6);
      }
    }

    function drawAxes(ctx, W, H, pad, xLabel, yLabel, xmin, xmax, ymin, ymax) {
      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(pad.l, pad.t);
      ctx.lineTo(pad.l, H - pad.b);
      ctx.lineTo(W - pad.r, H - pad.b);
      ctx.stroke();
      ctx.fillStyle = "#475569";
      ctx.font = "14px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(xLabel, W / 2, H - 14);
      ctx.save();
      ctx.translate(18, H / 2);
      ctx.rotate(-Math.PI / 2);
      ctx.fillText(yLabel, 0, 0);
      ctx.restore();
      ctx.textAlign = "right";
      for (let i = 0; i <= 4; i++) {
        const y = H - pad.b - i / 4 * (H - pad.t - pad.b);
        const val = ymin + i / 4 * (ymax - ymin);
        ctx.strokeStyle = "#e2e8f0";
        ctx.beginPath();
        ctx.moveTo(pad.l, y);
        ctx.lineTo(W - pad.r, y);
        ctx.stroke();
        ctx.fillStyle = "#64748b";
        ctx.fillText(fmt(val, 1), pad.l - 8, y + 4);
      }
      ctx.textAlign = "center";
      for (let i = 0; i <= 4; i++) {
        const x = pad.l + i / 4 * (W - pad.l - pad.r);
        const val = xmin + i / 4 * (xmax - xmin);
        ctx.fillStyle = "#64748b";
        ctx.fillText(fmt(val, 1), x, H - pad.b + 20);
      }
    }

    function exportCsv(id) {
      calculate(id);
      collectInputs();
      const page = document.querySelector(`[data-id="${id}"]`);
      const rows = [["字段", "值"]];
      page.querySelectorAll("[data-key]").forEach(el => {
        if (el.type !== "file") rows.push([el.dataset.key, el.value]);
      });
      page.querySelectorAll(".result-box").forEach((el, idx) => rows.push([`result_${idx + 1}`, el.textContent]));
      const csv = rows.map(row => row.map(cell => `"${String(cell ?? "").replaceAll('"', '""')}"`).join(",")).join("\n");
      downloadBlob(`${id}-实验数据.csv`, "\ufeff" + csv, "text/csv;charset=utf-8");
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;
      const source = String(text || "");
      for (let i = 0; i < source.length; i++) {
        const ch = source[i];
        if (quoted) {
          if (ch === '"' && source[i + 1] === '"') {
            cell += '"';
            i++;
          } else if (ch === '"') {
            quoted = false;
          } else {
            cell += ch;
          }
          continue;
        }
        if (ch === '"') {
          quoted = true;
        } else if (ch === ",") {
          row.push(cell);
          cell = "";
        } else if (ch === "\n") {
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
        } else if (ch !== "\r") {
          cell += ch;
        }
      }
      if (cell !== "" || row.length) {
        row.push(cell);
        rows.push(row);
      }
      if (rows[0]?.[0]) rows[0][0] = rows[0][0].replace(/^\ufeff/, "");
      return rows;
    }

    function importCsvText(id, text) {
      const rows = parseCsv(text);
      if (!rows.length) return 0;
      const page = document.querySelector(`.report-page[data-id="${id}"]`);
      if (!page) return 0;
      let count = 0;
      const applyPair = (key, val) => {
        key = String(key || "").trim().replace(/^\ufeff/, "");
        if (!key || key.startsWith("result_")) return;
        const el = Array.from(page.querySelectorAll("[data-key]")).find(item => item.dataset.key === key);
        if (!el || el.type === "file") return;
        el.value = val ?? "";
        count++;
      };
      const header = rows[0].map(cell => String(cell || "").trim());
      if (header[0] === "字段" && header[1] === "值") {
        rows.slice(1).forEach(row => applyPair(row[0], row[1] ?? ""));
      } else {
        const values = rows[1] || [];
        header.forEach((key, idx) => applyPair(key, values[idx] ?? ""));
      }
      calculate(id);
      collectInputs(page);
      state.activeId = activeId;
      localStorage.setItem(APP_KEY, JSON.stringify(state));
      return count;
    }

    function importCsvFile(id, file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const count = importCsvText(id, reader.result);
          setStatus(id, count ? `已导入 ${count} 个字段并刷新计算。` : "未找到可导入字段。");
        } catch (err) {
          console.error(err);
          setStatus(id, "CSV 导入失败，请检查文件格式。");
        }
      };
      reader.onerror = () => setStatus(id, "CSV 文件读取失败。");
      reader.readAsText(file, "utf-8");
    }

    function exportPng(id) {
      calculate(id);
      const canvas = document.querySelector(`.report-page[data-id="${id}"] canvas`);
      if (!canvas) return setStatus(id, "本实验暂无图表。");
      const link = document.createElement("a");
      link.download = `${id}-图表.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    function downloadBlob(name, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      a.click();
      URL.revokeObjectURL(url);
    }

    function wireUploads() {
      document.querySelectorAll("[data-upload]").forEach(input => {
        input.addEventListener("change", () => {
          const file = input.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            const id = input.dataset.upload;
            state.uploads ||= {};
            state.uploads[id] = reader.result;
            renderUploadPreview(id, reader.result);
            localStorage.setItem(APP_KEY, JSON.stringify(state));
          };
          reader.readAsDataURL(file);
        });
      });
      Object.entries(state.uploads || {}).forEach(([id, src]) => renderUploadPreview(id, src));
    }

    function renderUploadPreview(id, src) {
      const preview = document.querySelector(`[data-preview="${id}"]`);
      if (preview) preview.innerHTML = `<img alt="上传图片" src="${src}">`;
    }

    const REBOUND_DEMO_DATA = {
      carbonationAvg: "0.5",
      angle: "-90",
      pourFace: "top",
      strengthMode: "auto",
      pumpMode: "auto",
      coreFactor: "",
      reboundRows: [
        ["43", "40", "42", "45", "40", "40", "43", "35", "49", "43"],
        ["44", "35", "45", "45", "41", "42", "38", "45", "45", "42"],
        ["45", "47", "48", "46", "40", "42", "44", "31", "46", "43"],
        ["35", "45", "45", "44", "45", "48", "45", "47", "46", "48"],
        ["36", "44", "45", "43", "42", "41", "44", "45", "44", "46"],
        ["38", "48", "43", "45", "46", "45", "44", "40", "46", "45"],
        ["40", "45", "46", "44", "43", "45", "47", "40", "46", "46"],
        ["45", "48", "47", "42", "45", "43", "46", "45", "45", "42"],
        ["43", "42", "46", "46", "42", "45", "41", "42", "48", "45"],
        ["45", "42", "46", "48", "48", "51", "44", "40", "45", "44"],
        ["45", "46", "46", "41", "44", "50", "48", "40", "40", "46"],
        ["40", "46", "46", "44", "42", "45", "39", "43", "45", "47"],
        ["33", "43", "44", "47", "39", "46", "42", "38", "42", "45"],
        ["34", "48", "46", "47", "43", "46", "43", "45", "45", "48"],
        ["34", "43", "48", "41", "43", "45", "42", "40", "45", "43"],
        ["38", "47", "47", "40", "44", "46", "42", "44", "40", "50"]
      ]
    };

    function fillDemoData() {
      const id = activeId;
      if (id === "rebound") {
        setValue("carbonationAvg", REBOUND_DEMO_DATA.carbonationAvg, "rebound");
        setValue("angle", REBOUND_DEMO_DATA.angle, "rebound");
        setValue("pourFace", REBOUND_DEMO_DATA.pourFace, "rebound");
        setValue("strengthMode", REBOUND_DEMO_DATA.strengthMode, "rebound");
        setValue("pumpMode", REBOUND_DEMO_DATA.pumpMode, "rebound");
        setValue("coreFactor", REBOUND_DEMO_DATA.coreFactor, "rebound");
        REBOUND_DEMO_DATA.reboundRows.forEach((row, r) => {
          row.forEach((val, c) => setValue(`r_${r}_${c}`, val, "rebound"));
        });
      } else if (id === "carbonation") {
        for (let i = 0; i < 6; i++) for (let j = 0; j < 3; j++) setValue(`carb_${i}_${j}`, (1.2 + i * 0.2 + j * 0.1).toFixed(1), "carbonation");
      } else if (id === "cover") {
        setValue("cover_design", 35, "cover");
        for (let i = 0; i < 15; i++) setValue(`cover_d_${i}`, (33 + (i % 6) * 0.8).toFixed(1), "cover");
      } else if (id === "crack") {
        [100, 110, 120, 130, 140, 150].forEach((l, i) => {
          setValue(`crack_l_${i}`, l, "crack");
          setValue(`crack_tn_${i}`, (l / 4.2 + 2).toFixed(1), "crack");
          setValue(`crack_tc_${i}`, (Math.sqrt(l * l + 4 * 55 * 55) / 4.2 + 2).toFixed(1), "crack");
        });
      } else if (id === "pile") {
        setValue("pile_l", 800, "pile"); setValue("pile_t0", 2, "pile"); setValue("pile_tp", 1, "pile"); setValue("pile_a0", 1, "pile");
        for (let i = 0; i < 16; i++) {
          setValue(`pile_z_${i}`, (i * 0.25).toFixed(2), "pile");
          setValue(`pile_t_${i}`, (190 + (i === 8 ? 20 : i % 3)).toFixed(1), "pile");
          setValue(`pile_a_${i}`, (0.9 - (i === 8 ? 0.45 : i * 0.01)).toFixed(3), "pile");
          setValue(`pile_T_${i}`, (55 + i % 4).toFixed(1), "pile");
        }
      } else if (id === "bridge") {
        [9, 18, 27].forEach((load, i) => {
          setValue(`bridge_load_${i}`, load, "bridge");
          setValue(`bridge_strain_mid_${i}`, [-6, 18, 15][i], "bridge");
          setValue(`bridge_strain_q_out_${i}`, [-8, 20, 19][i], "bridge");
          setValue(`bridge_strain_q_in_${i}`, [-7, 21, 19][i], "bridge");
          setValue(`bridge_strain_support_${i}`, [-14, 11, 4][i], "bridge");
          setValue(`bridge_defl_q_out_${i}`, [-0.282, -0.581, -0.911][i], "bridge");
          setValue(`bridge_defl_q_in_${i}`, [-0.252, -0.595, -0.668][i], "bridge");
          setValue(`dyn_strain_1_${i}`, [18, 21, 19][i], "bridge");
          setValue(`dyn_strain_2_${i}`, ["", "", ""][i], "bridge");
          setValue(`dyn_defl_a_${i}`, [0.18, 0.22, 0.2][i], "bridge");
          setValue(`dyn_defl_b_${i}`, ["", "", ""][i], "bridge");
          setValue(`dyn_freq_${i}`, [18.3, 18.6, 18.4][i], "bridge");
          setValue(`dyn_damping_${i}`, [0.025, 0.026, 0.024][i], "bridge");
        });
        setValue("timeSeries", "0,0\n0.02,12\n0.04,18\n0.06,3\n0.08,-13\n0.10,-18\n0.12,-4\n0.14,11\n0.16,17", "bridge");
        setValue("fftSeries", "5,0.2\n10,0.3\n18.49,1.8\n29.44,0.7\n43.92,0.4", "bridge");
      }
      calculate(id);
      saveState();
    }

    function clearCurrent() {
      const page = document.querySelector(`[data-id="${activeId}"]`);
      page.querySelectorAll("[data-key]").forEach(el => { if (el.type !== "file") el.value = ""; });
      if (state[activeId]) state[activeId] = {};
      calculate(activeId);
      saveState();
    }

    document.addEventListener("click", e => {
      const nav = e.target.closest("[data-nav]");
      if (nav) showExperiment(nav.dataset.nav);
      const action = e.target.closest("[data-action]");
      if (action) {
        const id = action.dataset.id;
        if (action.dataset.action === "calc") calculate(id);
        if (action.dataset.action === "save") { calculate(id); saveState(); }
        if (action.dataset.action === "csv") exportCsv(id);
        if (action.dataset.action === "png") exportPng(id);
      }
    });

    document.addEventListener("change", e => {
      const input = e.target.closest("[data-import-csv]");
      if (!input) return;
      importCsvFile(input.dataset.importCsv, input.files?.[0]);
      input.value = "";
    });

    document.addEventListener("input", e => {
      if (e.target.matches("[data-key]")) calculate(e.target.closest(".report-page")?.dataset.id || activeId);
    });

    document.getElementById("mobileExperimentSelect").addEventListener("change", e => {
      showExperiment(e.target.value);
    });

    document.getElementById("saveAllBtn").addEventListener("click", () => {
      experiments.forEach(exp => calculate(exp.id));
      saveState();
      alert("全部实验数据已保存。");
    });
    document.getElementById("loadDemoBtn").addEventListener("click", fillDemoData);
    document.getElementById("clearCurrentBtn").addEventListener("click", clearCurrent);
    document.getElementById("printBtn").addEventListener("click", () => {
      collectInputs();
      localStorage.setItem(APP_KEY, JSON.stringify(state));
      window.print();
    });

    buildNav();
    buildReports();
    experiments.forEach(exp => calculate(exp.id));
    window.addEventListener("load", () => {
      if (window.MathJax?.typesetPromise) {
        window.MathJax.typesetPromise().catch(() => {});
      }
    });
  </script>
